<div class="w-full my-2" *ngIf="!this._UserAuthService.isuserlogin.value">
  <div class="mx-auto max-w-7xl px-6 sm:px-6 lg:px-8">
    <div class="relative flex h-16 justify-between">
      <div class="flex flex-1 items-stretch justify-start">
        <a class="flex flex-shrink-0 items-center">
          <img
            class="block h-16 w-auto"
            src="https://lh3.googleusercontent.com/UfokaMIo7gPs8IddVpU9lxekrOFtzp81tTOu8ZIa0H3nyywdwuEpO7erZbVpiybnVew=s85"
          />
        </a>
      </div>
      <div class="flex px-2 py-3 items-center space-x-8">
        <a
          class="text-gray-800 inline-flex items-center justify-center px-3 py-2 border border-transparent text-xl font-medium rounded-md shadow-xl outline-none"
          routerLink="/login"
          routerLinkActive="active"
          >Login</a
        >
        <a
          class="text-gray-800 inline-flex items-center justify-center px-3 py-2 border border-transparent text-xl font-medium rounded-md shadow-xl outline-none"
          routerLink="signup"
          routerLinkActive="active"
          >Register
        </a>
      </div>
    </div>
  </div>
</div>
<nav class="w-full my-2" *ngIf="this._UserAuthService.isuserlogin.value">
  <div class="mx-auto max-w-7xl px-6 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">
      <div
        class="flex items-center justify-center sm:items-center sm:justify-start"
      >
        <div class="flex shrink-0 items-center">
          <img
            class="h-16 w-auto"
            src="https://lh3.googleusercontent.com/UfokaMIo7gPs8IddVpU9lxekrOFtzp81tTOu8ZIa0H3nyywdwuEpO7erZbVpiybnVew=s85"
            alt="Your Company"
          />
        </div>
      </div>
      <div
        class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0"
      >
        <button
          type="button"
          class="relative rounded-full bg-[#076dc0] p-1 text-white"
        >
          <span class="absolute -inset-1.5"></span>
          <span class="sr-only">View notifications</span>
          <svg
            class="size-10"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            aria-hidden="true"
            data-slot="icon"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
            />
          </svg>
        </button>
        <div class="relative ml-3">
          <div>
            <span class="absolute -inset-1.5"></span>
            <p
              class="text-xl text-white size-12 rounded-full bg-[#076dc0] flex items-center justify-center"
            >
              US
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
